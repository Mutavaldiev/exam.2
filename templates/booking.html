{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h1>Book Field</h1>
    <h2>{{ field.name }}</h2>
    <p>Address: {{ field.address }}</p>
    <p>Price: {{ field.price }}</p>

    <form method="post">
        {% csrf_token %}
        <label>Do you have a team?</label>
        <select name="has_team" id="has_team" onchange="showPlayers()">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <div id="players_box" style="display:none;">
            <label>How many players do you need?</label>
            <input type="number" name="players_needed" min="1" value="1">
        </div>
        <button type="submit">Confirm Booking</button>
    </form>
</div>
{% endblock %}
